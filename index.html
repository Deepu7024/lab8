<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Registration</title>
<style>
  :root { --ink:#1d2a2f; --muted:#5d6b70; --line:#c9d3d6; --bg:#eef3f4; --card:#fff; --accent:#0f6e7a; --err:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Georgia,"Times New Roman",serif; background:var(--bg); color:var(--ink); padding:24px 16px; }
  .card { max-width:640px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:32px; }
  h1 { margin:0 0 4px; font-size:1.7rem; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .full { grid-column:1 / -1; }
  label, legend { display:block; font-size:.95rem; margin-bottom:6px; font-weight:bold; }
  input[type=text], input[type=tel], input[type=email], select {
    width:100%; padding:10px 12px; font:inherit; border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:1px; }
  fieldset { border:0; padding:0; margin:0; }
  .radios label { display:inline-block; font-weight:normal; margin-right:18px; }
  .error { color:var(--err); font-size:.85rem; min-height:1.1em; margin-top:4px; }
  .actions { display:flex; gap:12px; margin-top:8px; }
  button { font:inherit; padding:11px 22px; border-radius:4px; cursor:pointer; border:1px solid var(--accent); }
  button[type=submit] { background:var(--accent); color:#fff; }
  button[type=reset] { background:#fff; color:var(--accent); }
  @media (max-width:560px){ .grid{grid-template-columns:1fr;} .card{padding:22px;} }
</style>
</head>
<body>
<div class="card">
  <h1>User registration</h1>
  <p class="sub">Fill in your details and select Save details to view them on the next page.</p>

  <form id="userForm" novalidate>
    <div class="grid">
      <div class="full">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name">
        <div class="error" id="err-name"></div>
      </div>

      <fieldset class="full radios">
        <legend>Gender</legend>
        <label><input type="radio" name="gender" value="Male"> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
        <label><input type="radio" name="gender" value="Other"> Other</label>
        <div class="error" id="err-gender"></div>
      </fieldset>

      <div>
        <label for="mobile">Mobile number</label>
        <input type="tel" id="mobile" name="mobile" inputmode="numeric" maxlength="10" placeholder="10-digit number" autocomplete="tel">
        <div class="error" id="err-mobile"></div>
      </div>

      <div>
        <label for="email">Email ID</label>
        <input type="email" id="email" name="email" autocomplete="email">
        <div class="error" id="err-email"></div>
      </div>

      <div>
        <label for="city">City</label>
        <input type="text" id="city" name="city">
        <div class="error" id="err-city"></div>
      </div>

      <div>
        <label for="state">State</label>
        <select id="state" name="state">
          <option value="">Select state</option>
          <option>Andhra Pradesh</option><option>Delhi</option><option>Gujarat</option>
          <option>Karnataka</option><option>Kerala</option><option>Maharashtra</option>
          <option>Tamil Nadu</option><option>Telangana</option><option>Uttar Pradesh</option>
          <option>West Bengal</option><option>Other</option>
        </select>
        <div class="error" id="err-state"></div>
      </div>

      <div class="full">
        <label for="country">Country</label>
        <select id="country" name="country">
          <option value="">Select country</option>
          <option>India</option><option>United States</option><option>United Kingdom</option>
          <option>Canada</option><option>Australia</option><option>Other</option>
        </select>
        <div class="error" id="err-country"></div>
      </div>
    </div>

    <div class="actions">
      <button type="submit">Save details</button>
      <button type="reset" id="resetBtn">Clear</button>
    </div>
  </form>
</div>

<script>
  const form = document.getElementById("userForm");

  function setError(field, msg) {
    document.getElementById("err-" + field).textContent = msg;
    return msg === "";
  }

  function validate() {
    const v = {
      name: form.name.value.trim(),
      gender: (form.querySelector('input[name="gender"]:checked') || {}).value || "",
      mobile: form.mobile.value.trim(),
      email: form.email.value.trim(),
      city: form.city.value.trim(),
      state: form.state.value,
      country: form.country.value
    };
    let ok = true;
    ok = setError("name", /^[A-Za-z][A-Za-z .'-]{1,}$/.test(v.name) ? "" : "Enter your full name using letters only.") && ok;
    ok = setError("gender", v.gender ? "" : "Select a gender.") && ok;
    ok = setError("mobile", /^[6-9]\d{9}$/.test(v.mobile) ? "" : "Enter a 10-digit mobile number starting with 6, 7, 8 or 9.") && ok;
    ok = setError("email", /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email) ? "" : "Enter a valid email address.") && ok;
    ok = setError("city", v.city ? "" : "Enter your city.") && ok;
    ok = setError("state", v.state ? "" : "Select your state.") && ok;
    ok = setError("country", v.country ? "" : "Select your country.") && ok;
    return ok ? v : null;
  }

  // Allow only digits in the mobile field
  form.mobile.addEventListener("input", () => {
    form.mobile.value = form.mobile.value.replace(/\D/g, "");
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const data = validate();
    if (!data) return;
    // Pass the data to the next page through the URL query string
    const params = new URLSearchParams(data);
    window.location.href = "display.html?" + params.toString();
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    document.querySelectorAll(".error").forEach(el => el.textContent = "");
  });
</script>
</body>
</html>
